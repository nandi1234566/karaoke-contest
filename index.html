<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karaoke Night — Security Awareness Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#250038,#6b146f);color:#fff;display:flex;justify-content:center;padding:7vh 20px}.card{width:min(900px,100%);background:#4b1d5e;border:1px solid #80508f;border-radius:38px;padding:48px 32px 58px;text-align:center;box-shadow:0 20px 60px #16002080}.kicker{font-size:24px}.title{font-size:68px;margin:20px 0 22px;font-weight:800}.sub{font-size:25px;color:#e3dbe7;margin-bottom:36px}.prize{font-size:50px;color:#ffd24d;font-weight:800;margin:20px 0 42px}form{max-width:470px;margin:auto;text-align:left}.field{margin:15px 0}.field label{display:block;margin-bottom:7px;font-weight:700}input{width:100%;padding:15px 16px;border-radius:10px;border:1px solid #bbb;font-size:17px}button{width:100%;margin-top:12px;padding:16px;border:0;border-radius:10px;background:#fff;color:#43204f;font-size:18px;font-weight:700;cursor:pointer}.notice{margin:25px auto 0;max-width:700px;color:#d9cadf;font-size:16px;line-height:1.5}#result{display:none;margin:25px auto 0;max-width:650px;padding:18px;border-radius:12px;background:#26102f;border:1px solid #9c70a9;line-height:1.5}
</style>
</head>
<body><main class="card">
<div class="kicker">🎤 KARAOKE NIGHT</div><h1 class="title">Sing &amp; Win</h1>
<div class="sub">Submit your best karaoke performance for a chance to win.</div>
<div class="prize">🏆 ₹1,000 PRIZE</div>
<form id="demoForm">
<div class="field"><label>Gmail ID</label><input id="email" type="email" placeholder="demo@example.com" required></div>
<div class="field"><label>Password (training field)</label><input id="password" type="password" placeholder="Use a dummy password only" required></div>
<div class="field"><label>UPI ID for mock prize claim</label><input id="upi" type="text" placeholder="demo@upi" required></div>
<button>Continue</button></form>
<div id="result"></div>
<div class="notice"><strong>Security-awareness simulation.</strong><br>
Only the email and non-sensitive training flags are sent to the database. The password and UPI value are discarded in the browser and are never transmitted or stored.</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://gcuzrmazrpowinddznwv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_2QsJX8rH5oZnDmtYrj_dHQ_J0bA7KtC";
const db = (SUPABASE_URL.startsWith("http") && !SUPABASE_ANON_KEY.startsWith("PASTE_"))
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

document.getElementById("demoForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const upi=document.getElementById("upi").value.trim();

  // Safe telemetry only. Never send password or UPI.
  const record={
    email,
    password_attempted: password.length > 0,
    upi_provided: upi.length > 0,
    campaign: "karaoke-awareness",
    user_agent: navigator.userAgent
  };

  let message="Simulation complete. The password and UPI value were discarded and were not stored.";
  if(db){
    const {error}=await db.from("training_submissions").insert(record);
    if(error) message += " (Database recording failed: check your Supabase URL/key/table policy.)";
    else message += " The safe training event was recorded.";
  } else {
    message += " Add your Supabase project URL and publishable key to enable safe event logging.";
  }

  document.getElementById("result").style.display="block";
  document.getElementById("result").textContent=message;
  document.getElementById("password").value="";
  document.getElementById("upi").value="";
});


</script>
</body></html>
